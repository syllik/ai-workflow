schemaVersion: 2
canonicalRoot: ~/Desktop/WORK
# Deprecated and ignored by the current validator. Kept only so the trusted
# activation check on the previous base still passes; removed in a follow-up PR.
budgets:
  AI.md: 1024
  FLOW.md: 2048
  global role file: 6144
  managed AGENTS block: 1024
  .ai/context.md: 8192
  one decision record: 4096
  prompt.md: 8192
  state.md: 2048
  assembled execution context: 32768
  result.md: 4096
  human plan.md: 16384
contextPolicy:
  supportedVersions: [1, 2]
  defaultNewTaskVersion: 2
  rolloutAllowlist:
    - syllik/syllik
    - syllik/life-ops
    - syllik/life-ops-bot
    - ChipIn-one/chipin-frontend
    - ChipIn-one/.github
    - syllik/chatgpt-archive-cleanup
    - syllik/youtube-metadata-translator
    - syllik/ai-workflow
    - syllik/gpg-signed-commits
    - syllik/Zero-Touch-DCA
  excludedRepositories: []
executionPolicy:
  contractVersion: 2
  roles: [planner, architect, executor, reviewer, auditor]
  modelSelection: risk-capability
  publisher:
    kind: trusted
    publicationBatchesPerRevision: 1
    historyRewrite: forbidden
  review:
    reviewsPerHeadSha: 1
    requiresGreenCi: true
    findings: consolidated
    reviewerMutations: forbidden
  corrections:
    authorization: upfront-or-legacy-human
    maxBatches: 2
  merge: human-only
gitLifecycle:
  canonicalBranch: master
  normalMergeMethod: squash
  productionPromotion: exact-commit
  temporaryIssueBranchPattern: <type>/issue-<number>-<slug>
  repositories:
    - repository: syllik/syllik
      deploymentProfile: none
      branchState: canonical
      defaultBranch: master
      integrationBranch: master
    - repository: syllik/ai-workflow
      deploymentProfile: none
      branchState: canonical
      defaultBranch: master
      integrationBranch: master
    - repository: syllik/Zero-Touch-DCA
      deploymentProfile: none
      branchState: canonical
      defaultBranch: master
      integrationBranch: master
    - repository: ChipIn-one/.github
      deploymentProfile: none
      branchState: canonical
      defaultBranch: master
      integrationBranch: master
    - repository: ChipIn-one/chipin-knowledge-base
      deploymentProfile: none
      branchState: canonical
      defaultBranch: master
      integrationBranch: master
    - repository: ChipIn-one/chipin-frontend
      deploymentProfile: production
      branchState: canonical
      defaultBranch: master
      integrationBranch: master
    - repository: ChipIn-one/chipin-backend
      deploymentProfile: production
      branchState: migration
      defaultBranch: develop
      integrationBranch: develop
projects:
  - id: syllik/syllik
    repository: syllik/syllik
    localPath: profile/syllik
    group: profile
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
  - id: syllik/life-ops
    repository: syllik/life-ops
    localPath: personal/life-ops
    group: personal
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
  - id: syllik/life-ops-bot
    repository: syllik/life-ops-bot
    localPath: personal/life-ops-bot
    group: personal
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
    contextDependencies:
      - repository: syllik/life-ops
        integrationBranch: master
        access: read-only
  - id: ChipIn-one/chipin-frontend
    repository: ChipIn-one/chipin-frontend
    localPath: products/chipin/chipin-frontend
    group: products/chipin
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
    contextDependencies:
      - repository: ChipIn-one/chipin-knowledge-base
        integrationBranch: master
        access: read-only
  - id: ChipIn-one/chipin-backend
    repository: ChipIn-one/chipin-backend
    localPath: products/chipin/chipin-backend
    group: products/chipin
    access: read-only
    status: active
    integrationBranch: develop
    contextDependencies:
      - repository: ChipIn-one/chipin-knowledge-base
        integrationBranch: master
        access: read-only
  - id: ChipIn-one/chipin-knowledge-base
    repository: ChipIn-one/chipin-knowledge-base
    localPath: products/chipin/chipin-knowledge-base
    group: products/chipin
    access: read-only
    status: active
    integrationBranch: master
  - id: ChipIn-one/.github
    repository: ChipIn-one/.github
    localPath: products/chipin/.github
    group: products/chipin
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
  - id: syllik/chatgpt-archive-cleanup
    repository: syllik/chatgpt-archive-cleanup
    localPath: tools/ai/chatgpt-archive-cleanup
    group: tools/ai
    access: managed
    status: active
    integrationBranch: main
    contextPath: .ai/context.md
  - id: syllik/youtube-metadata-translator
    repository: syllik/youtube-metadata-translator
    localPath: tools/content/youtube-metadata-translator
    group: tools/content
    access: managed
    status: active
    integrationBranch: main
    contextPath: .ai/context.md
  - id: syllik/ai-workflow
    repository: syllik/ai-workflow
    localPath: workflows/ai/ai-workflow
    group: workflows/ai
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
  - id: syllik/gpg-signed-commits
    repository: syllik/gpg-signed-commits
    localPath: guides/git/gpg-signed-commits
    group: guides/git
    access: managed
    status: active
    integrationBranch: main
    contextPath: .ai/context.md
  - id: syllik/Zero-Touch-DCA
    repository: syllik/Zero-Touch-DCA
    localPath: products/Zero-Touch-DCA
    group: products
    access: managed
    status: active
    integrationBranch: master
    contextPath: .ai/context.md
